# Take one version of one plugin out of the index.
#
# Manual, and a dry run unless asked otherwise. For a release that should
# never have been installable: published under the wrong number, or broken.
# Core can no longer install it or roll back to it; a house already running it
# keeps running it. A plugin left with no versions is no longer listed. Delete
# the GitHub Release it pointed at separately, if it should go too.
name: Withdraw a version
on:
  workflow_dispatch:
    inputs:
      plugin_id: { description: 'Plugin id, e.g. plugin.matter', required: true }
      version: { description: 'The version to withdraw, e.g. 0.3.0', required: true }
      apply: { description: 'Write it (false: only say what would happen)', type: boolean, default: false }
permissions:
  contents: write
  # To start pages.yml.
  actions: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --quiet cryptography
      - name: What would happen
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
          VERSION: ${{ inputs.version }}
        run: python scripts/withdraw-version.py public/index.json "$PLUGIN_ID" "$VERSION" --dry-run
      - name: Withdraw, sign and commit
        id: write
        if: ${{ inputs.apply }}
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
          VERSION: ${{ inputs.version }}
          REGISTRY_SECRET_KEY: ${{ secrets.REGISTRY_SECRET_KEY }}
        run: |
          set -euo pipefail
          git config user.name  "homecore-registry[bot]"
          git config user.email "registry@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            python scripts/withdraw-version.py public/index.json "$PLUGIN_ID" "$VERSION"
            python scripts/sign-index.py public/index.json
            git add public/index.json public/index.json.sig
            git commit -q -m "registry: withdraw $PLUGIN_ID $VERSION"
            if git push -q; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::push rejected (attempt ${attempt}); withdrawing from the current index again"
            git reset --hard HEAD~1
            git fetch -q origin "${GITHUB_REF_NAME:-main}"
            git reset --hard "origin/${GITHUB_REF_NAME:-main}"
            sleep $(( attempt * 3 ))
          done
          echo "::error::could not write the index after 5 attempts; run this again"
          exit 1
      # See prune.yml: a push made with GITHUB_TOKEN doesn't start pages.yml.
      - name: Hand the deploy to pages.yml
        if: ${{ inputs.apply && steps.write.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
