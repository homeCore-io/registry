name: Deploy registry to Pages

# Serves public/ (index.json, index.json.sig, pubkey.txt) at
# https://homeCore-io.github.io/registry/ . Runs on any change to public/
# (the publish workflow commits there) and can be run manually.
on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish (don't cancel).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      # main as it is now, not the commit this run was started at: the publish
      # workflows start it after each push, and when several publish at once
      # GitHub keeps only the newest pending run, so that run deploys them all.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # deploy-pages sometimes can't yet see the artifact uploaded a second
      # earlier ("No artifacts named github-pages", 2026-11-25 and -26), and a
      # re-run of the run then fails on two artifacts. So wait and try once
      # more here, in the same run, with the same artifact.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
